[project]
name = "qwen-voiceclone"
version = "0.1.0"
description = "Isolated Qwen3-TTS single-speaker voice-cloning workflow"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "huggingface-hub>=0.24",
  "soundfile>=0.12",
]

[project.optional-dependencies]
train = ["wandb>=0.22.3"]
eval = ["faster-whisper>=1.1", "jiwer>=3.0", "speechbrain>=1.0", "torch>=2.4"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
qwen-voiceclone = "qwen_voiceclone.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_voiceclone"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Typer's documented command signature uses `typer.Option(...)` defaults.
ignore = ["B008"]
